[package]
name = "benilla-pad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gamepad play on top of benilla: the pad in Rust, the gamepad bar as the BenillaPad addon, every press run as a 1.12 binding command"

[lints]
workspace = true

[features]
default = ["dev", "improved-water"]
dev = ["benilla-app/dev"]
# The Improved Water plugin (crates/benilla-water); the player build keeps it:
# `cargo build -p benilla-pad --profile ship --no-default-features --features improved-water`.
improved-water = ["benilla-app/improved-water"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }
benilla-ui = { path = "../benilla-ui" }
benilla-world = { path = "../benilla-world" }
bevy.workspace = true
# The BenillaPad addon, embedded and installed into benilla-config/AddOns.
include_dir = "0.7"

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "benilla-pad"
path = "src/main.rs"
test = false
